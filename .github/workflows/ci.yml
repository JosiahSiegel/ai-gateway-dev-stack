name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck (stack script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on stack
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x -S warning
        with:
          scandir: .
          additional_files: stack
          ignore_paths: manifest-local claude-proxy homepage .stack

  actionlint:
    name: actionlint (workflow files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: raven-actions/actionlint@v2

  yamllint:
    name: yamllint (compose + homepage configs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run yamllint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: compose.yml homepage/
          config_data: |
            extends: relaxed
            rules:
              line-length: disable
              truthy:
                allowed-values: ['true', 'false', 'on', 'off']
                check-keys: false
              comments:
                min-spaces-from-content: 1

  compose-config:
    name: docker compose config (parent overlay validates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Init only the public manifest-local submodule
        run: |
          # claude-proxy is private; GITHUB_TOKEN on PR runs cannot reach it,
          # so we can't use `actions/checkout`'s `submodules: recursive`
          # (which would fail the whole step). manifest-local is public, so
          # initialize it by name.
          git submodule update --init manifest-local

      - name: Seed .env from example
        run: |
          cp .env.example .env
          # ./stack up auto-generates these on first boot; for static checks
          # we just need any non-empty value so compose interpolation succeeds.
          sed -i 's/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=ci-placeholder-secret/' .env
          sed -i 's/^MANIFEST_ENCRYPTION_KEY=$/MANIFEST_ENCRYPTION_KEY=ci-placeholder-key/' .env

      - name: Validate compose (no profile)
        run: |
          docker compose \
            --project-directory . \
            --env-file .env \
            -f manifest-local/docker-compose.yml \
            -f compose.yml \
            config --quiet

      - name: Validate compose (tailnet profile)
        run: |
          docker compose \
            --project-directory . \
            --env-file .env \
            -f manifest-local/docker-compose.yml \
            -f compose.yml \
            --profile tailnet config --quiet

  helper-output:
    name: stack helper output is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Seed .env from example
        run: |
          cp .env.example .env
          # ./stack up auto-generates these on first boot; for static checks
          # we just need any non-empty value so compose interpolation succeeds.
          sed -i 's/^BETTER_AUTH_SECRET=$/BETTER_AUTH_SECRET=ci-placeholder-secret/' .env
          sed -i 's/^MANIFEST_ENCRYPTION_KEY=$/MANIFEST_ENCRYPTION_KEY=ci-placeholder-key/' .env

      - name: opencode snippet is parseable JSON on stdout
        run: |
          # Prose goes to stderr; stdout must be a single JSON document.
          ./stack opencode 2>/dev/null \
            | python3 -c 'import json,sys; json.load(sys.stdin)'

      - name: claude snippet is parseable JSON with both settings blocks
        run: |
          ./stack claude 2>/dev/null \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert "settings" in d and "settings_local" in d, d.keys(); assert d["settings"]["env"]["ANTHROPIC_BASE_URL"]; assert d["settings_local"]["env"]["ANTHROPIC_AUTH_TOKEN"]'

      - name: help lists every subcommand (catches drift)
        run: |
          out="$(./stack help)"
          for sub in up down restart status logs pull opencode claude expose unexpose autostart; do
            echo "$out" | grep -qE "^[[:space:]]*\./stack ${sub}([[:space:]]|$)" \
              || { echo "missing in ./stack help: $sub"; echo "$out"; exit 1; }
          done

      - name: autostart status is safe to call without root or systemd
        run: |
          # On the CI runner systemctl exists but the unit doesn't — the
          # command should print "not installed" and exit 0, never error.
          ./stack autostart status

  
