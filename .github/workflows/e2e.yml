name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC — catch upstream Manifest image drift.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stack-up:
    name: ./stack up + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show Docker + Compose versions
        run: |
          docker version
          docker compose version

      - name: Bring stack up
        run: ./stack up

      - name: Wait for Manifest to respond
        run: |
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:2099/ || true)"
            echo "attempt $i: manifest status=$code"
            case "$code" in
              200|301|302|303|307|308) exit 0 ;;
            esac
            sleep 2
          done
          echo "Manifest never became reachable on :2099" >&2
          exit 1

      - name: Wait for Homepage to respond
        run: |
          for i in $(seq 1 30); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:2100/ || true)"
            echo "attempt $i: homepage status=$code"
            case "$code" in
              200|301|302|303|307|308) exit 0 ;;
            esac
            sleep 2
          done
          echo "Homepage never became reachable on :2100" >&2
          exit 1

      - name: claude-proxy is healthy (compose healthcheck reports healthy)
        run: |
          for i in $(seq 1 30); do
            code="$(docker compose \
              --project-directory . \
              --env-file .env \
              -f manifest-local/docker-compose.yml \
              -f compose.yml \
              exec -T claude-proxy \
              curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/healthz || true)"
            echo "attempt $i: claude-proxy /healthz=$code"
            case "$code" in
              200) exit 0 ;;
            esac
            sleep 2
          done
          echo "claude-proxy never became healthy" >&2
          exit 1

      - name: ./stack status
        if: always()
        run: ./stack status || true

      - name: Dump container logs
        if: failure()
        run: |
          echo "--- manifest ---"
          docker compose \
            --project-directory . \
            --env-file .env \
            -f manifest-local/docker-compose.yml \
            -f compose.yml logs manifest || true
          echo "--- postgres ---"
          docker compose \
            --project-directory . \
            --env-file .env \
            -f manifest-local/docker-compose.yml \
            -f compose.yml logs postgres || true
          echo "--- homepage ---"
          docker compose \
            --project-directory . \
            --env-file .env \
            -f manifest-local/docker-compose.yml \
            -f compose.yml logs homepage || true
          echo "--- claude-proxy ---"
          docker compose \
            --project-directory . \
            --env-file .env \
            -f manifest-local/docker-compose.yml \
            -f compose.yml logs claude-proxy || true

      - name: Tear stack down
        if: always()
        run: ./stack down || true
