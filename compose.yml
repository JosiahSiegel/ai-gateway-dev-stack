# Parent-level overlay layered on top of manifest-local/docker-compose.yml.
#
# Invoked by ./stack as:
#   docker compose --project-directory . --env-file .env \
#     -f manifest-local/docker-compose.yml \
#     -f compose.yml \
#     [--profile tailnet] up -d
#
# manifest-local owns the real Manifest + Postgres services, networks, and
# pinned volume. Do NOT override `name:` here — manifest-local pins `mnfst`
# so existing standalone installs keep their containers/volumes.
#
# This file adds:
#   - claude-proxy : Anthropic-Messages-compatible subscription proxy
#                    (built from ./claude-proxy; OAuth-only; frontend only)
#   - homepage     : gethomepage.dev dashboard (Docker label auto-discovery)
#   - tailnet-poller : optional sidecar that mirrors tailnet devices into
#                      homepage/config/services.yaml (profile: tailnet)
#
# claude-proxy runs as a compose service on the frontend network (no host port
# publish; reached in-network at http://claude-proxy:8080 by Manifest).

services:
  # Manifest is intentionally NOT decorated with homepage.* labels here.
  # The tailnet-poller surfaces it via the VIP services API ("Tailscale
  # Services" group), which has the correct tailnet URL. Labeling it
  # additionally would create a duplicate tile pointing at localhost.
  manifest:
    # Survive host reboots and Docker daemon restarts. The submodule's
    # docker-compose.yml intentionally omits this so the standalone
    # manifest-local install stays minimal; we add it here at the parent
    # so `./stack` users get autostart by default.
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # ── TEMPORARY TRIAGE (anthropic-billing-header v0.6.2 debug capture) ──
    # The plugin lives INSIDE this image, baked in at build time by the
    # manifest-plugins repo (JosiahSiegel/manifest-plugins). The build
    # fetches external plugins from external-plugins.local.json, which is
    # materialized from the EXTERNAL_PLUGINS_LOCAL GitHub Actions secret
    # at the start of the build-image workflow. To get v0.6.2 in this
    # container: bump the ref in that secret to v0.6.2, then trigger an
    # image rebuild (push any commit or tag to manifest-plugins:main).
    # Until that image is rebuilt and pushed, this env var does nothing.
    # 1 = summary (no PII). full = also dumps serialized body.
    environment:
      - MANIFEST_CC_DEBUG_CAPTURE=${MANIFEST_CC_DEBUG_CAPTURE:-1}

  postgres:
    # Same reasoning as manifest above — make Postgres come back on reboot
    # without modifying the submodule.
    restart: unless-stopped

  # claude-proxy (./claude-proxy submodule): subscription OAuth proxy for
  # Anthropic-Messages-compatible calls. Reaches the host network only via the
  # frontend bridge (NOT internal — it has no need for postgres). Built from
  # the submodule so `git submodule update` against a newer claude-proxy
  # commit picks up the change on next image rebuild.
  claude-proxy:
    build:
      context: ./claude-proxy
    image: claude-proxy:dev
    container_name: claude-proxy
    restart: unless-stopped
    user: "1000:1000"
    init: true
    # No `ports:` block — in-network only. Manifest reaches it at
    # http://claude-proxy:8080 via the frontend bridge.
    networks:
      - frontend
    environment:
      CLAUDE_PROXY_HOST: "0.0.0.0"
      CLAUDE_PROXY_PORT: ${CLAUDE_PROXY_PORT:-8080}
      CLAUDE_PROXY_LOG_LEVEL: ${CLAUDE_PROXY_LOG_LEVEL:-INFO}
      CLAUDE_PROXY_SETTINGS_FILE: ${CLAUDE_PROXY_SETTINGS_FILE:-/etc/claude-proxy/claude-settings.json}
      CLAUDE_PROXY_WORK_DIR: ${CLAUDE_PROXY_WORK_DIR:-/var/lib/claude-proxy/sessions}
      CLAUDE_PROXY_NUM_SLOTS: ${CLAUDE_PROXY_NUM_SLOTS:-1}
      CLAUDE_PROXY_ALLOWED_CLI_VERSIONS: ${CLAUDE_PROXY_ALLOWED_CLI_VERSIONS:-}
      CLAUDE_PROXY_AUTH_TOKEN: ${CLAUDE_PROXY_AUTH_TOKEN:-}
      CLAUDE_PROXY_USER_RATE_LIMIT_CAPACITY: ${CLAUDE_PROXY_USER_RATE_LIMIT_CAPACITY:-60}
      CLAUDE_PROXY_USER_RATE_LIMIT_REFILL_PER_SECOND: ${CLAUDE_PROXY_USER_RATE_LIMIT_REFILL_PER_SECOND:-1.0}
      CLAUDE_PROXY_ENABLE_TOOLS: ${CLAUDE_PROXY_ENABLE_TOOLS:-false}
      CLAUDE_PROXY_STRUCTURED_LOGS: ${CLAUDE_PROXY_STRUCTURED_LOGS:-true}
      CLAUDE_PROXY_CREDENTIALS_PATH_TEMPLATE: ${CLAUDE_PROXY_CREDENTIALS_PATH_TEMPLATE:-"{home}/.claude/.credentials.json"}
      CLAUDE_PROXY_MODELS: ${CLAUDE_PROXY_MODELS:-}
    volumes:
      - claude-proxy-credentials:/home/claude-proxy/.claude
      - claude-proxy-data:/var/lib/claude-proxy/sessions
      - claude-proxy-config:/etc/claude-proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: 5
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: "2.0"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-2100}:3000"
    environment:
      # CSRF allow-list. Defaults to localhost:${HOMEPAGE_PORT}; override in
      # .env when reaching homepage via a tailnet hostname, e.g.
      # HOMEPAGE_ALLOWED_HOSTS=localhost:2100,dash.tailXXXXXX.ts.net
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_ALLOWED_HOSTS:-localhost:${HOMEPAGE_PORT:-2100}}
      # Exposed to YAML configs as {{HOMEPAGE_VAR_TS_DOMAIN}}.
      HOMEPAGE_VAR_TS_DOMAIN: ${TAILSCALE_TS_DOMAIN:-}
    volumes:
      - ./homepage/config:/app/config
      # services.yaml is generated (seeded from services.template.yaml; live-
      # rewritten by tailnet-poller when enabled). Keep generated output out
      # of homepage/config/ so that directory stays hand-edit-only. The file
      # must exist on the host before container start; ./stack seeds it.
      - ./homepage/.generated/services.yaml:/app/config/services.yaml
      # Read-only socket mount enables Docker label auto-discovery. Any
      # container in this stack with homepage.* labels appears automatically.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frontend
    labels:
      homepage.group: "AI Gateway Stack"
      homepage.name: "Homepage"
      homepage.icon: "mdi-view-dashboard"
      homepage.href: "${HOMEPAGE_PUBLIC_URL:-http://localhost:${HOMEPAGE_PORT:-2100}}"
      homepage.description: "Service dashboard (this page)"

  # Optional. Activated by ./stack when TAILSCALE_API_KEY is set in .env, or
  # manually: docker compose --profile tailnet up -d
  tailnet-poller:
    image: node:22-alpine
    container_name: tailnet-poller
    restart: unless-stopped
    command: ["node", "/work/poll.js"]
    environment:
      TAILSCALE_API_KEY: ${TAILSCALE_API_KEY:-}
      TAILSCALE_OAUTH_CLIENT_ID: ${TAILSCALE_OAUTH_CLIENT_ID:-}
      TAILSCALE_OAUTH_CLIENT_SECRET: ${TAILSCALE_OAUTH_CLIENT_SECRET:-}
      TAILSCALE_TAILNET: ${TAILSCALE_TAILNET:--}
      TAILSCALE_TS_DOMAIN: ${TAILSCALE_TS_DOMAIN:-}
      TAILSCALE_HOSTNAME: ${TAILSCALE_HOSTNAME:-}
      HOMEPAGE_SSH_USER: ${HOMEPAGE_SSH_USER:-root}
      HOMEPAGE_SSH_TILE: ${HOMEPAGE_SSH_TILE:-1}
      TAILSCALE_TAG_FILTER: ${TAILSCALE_TAG_FILTER:-}
      POLL_INTERVAL_MS: ${TAILSCALE_POLL_INTERVAL_MS:-60000}
      TEMPLATE_PATH: /template/services.template.yaml
      OUTPUT_PATH: /output/services.yaml
    volumes:
      - ./homepage/tailnet-poller:/work:ro
      - ./homepage/services.template.yaml:/template/services.template.yaml:ro
      # Writes services.yaml here; compose mounts the same file into the
      # homepage container at /app/config/services.yaml.
      - ./homepage/.generated:/output
    networks:
      - frontend
    profiles: ["tailnet"]

# Top-level named volumes. Pin `name:` so a standalone claude-proxy install
# that already created these volumes is adopted by the parent stack (same
# trick `manifest-local` uses for `pgdata`).
volumes:
  claude-proxy-credentials:
    name: claude-proxy-credentials
  claude-proxy-data:
    name: claude-proxy-data
  claude-proxy-config:
    name: claude-proxy-config
