# Parent-level overlay layered on top of manifest-local/docker-compose.yml.
#
# Invoked by ./stack as:
#   docker compose --project-directory . --env-file .env \
#     -f manifest-local/docker-compose.yml \
#     -f compose.yml \
#     up -d
#
# Intentionally minimal: manifest-local already sets up everything (services,
# networks, extra_hosts: host.docker.internal). The provider-proxy runs on
# the host (it binds 127.0.0.1 by design), managed by the ./stack script.
#
# We deliberately do NOT override `name:` here — manifest-local pins
# `name: mnfst`, and keeping it means any existing standalone install of
# manifest-local picks up its same containers / volumes when running via
# `./stack up`. No data migration needed.
#
# Add overrides here when you need to extend Manifest's compose config
# without touching the manifest-local submodule (e.g. additional env vars,
# extra services that should share the same docker network).
