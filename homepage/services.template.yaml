# Source of truth for homepage services. Edited by hand.
#
# How this file is used:
#   - If no Tailscale credentials are set: ./stack copies this file
#     verbatim to homepage/config/services.yaml on first boot.
#   - If credentials are set (API key or OAuth): the tailnet-poller reads
#     this file, appends managed `- Tailnet:` and `- Tailscale Services:`
#     groups built from the Tailscale API, and writes the result to
#     homepage/config/services.yaml every TAILSCALE_POLL_INTERVAL_MS.
#
# Do NOT add `- Tailnet:` or `- Tailscale Services:` groups here yourself,
# and do NOT edit anything below the TAILNET_POLLER_MANAGED marker line —
# it gets overwritten on every poll. Add static entries above the marker
# only.
#
# Stack-internal services (Manifest, Homepage) are auto-discovered via
# Docker labels (see compose.yml + homepage/config/docker.yaml). VIP
# services like provider-proxy come from the Tailscale services API.

# Add static entries here for anything not auto-discovered. Stack-internal
# services (Manifest, Homepage) come from Docker labels in compose.yml.
# Tailnet machines and VIP services come from the tailnet-poller (below
# the marker) — do not duplicate them here.
