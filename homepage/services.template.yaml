# Source of truth for homepage service tiles. Edited by hand.
#
# How this file is used:
#   - On first ./stack up: copied to homepage/.generated/services.yaml.
#   - If TAILSCALE_API_KEY (or OAuth client) is set: the tailnet-poller
#     reads this template, appends managed `- Tailnet:` and
#     `- Tailscale Services:` groups built from the Tailscale API, and
#     writes the result to homepage/.generated/services.yaml every
#     TAILSCALE_POLL_INTERVAL_MS.
#
# compose.yml bind-mounts homepage/.generated/services.yaml into the
# container at /app/config/services.yaml. Do not edit the generated file
# directly — edit this template and run `./stack restart homepage`.
#
# Do NOT add `- Tailnet:` or `- Tailscale Services:` groups here yourself;
# the poller manages those. Stack-internal services (Manifest, Homepage)
# are auto-discovered via Docker labels (see compose.yml).

# Add static entries here for anything not auto-discovered. Tailnet machines
# and VIP services are appended by the poller (below the marker in the
# generated file) — do not duplicate them here.
